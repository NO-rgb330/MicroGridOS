<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vOS · Mainframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;        /* Slate 900 */
    --panel: #1e293b;     /* Slate 800 */
    --edge: #334155;      /* Slate 700 */
    --fg: #e2e8f0;        /* Slate 200 */
    --fg-dim: #94a3b8;    /* Slate 400 */
    --accent: #ffb86c;    /* Retro Amber */
    --accent-dim: #b88345;
    --warn: #fbbf24;      
    --crit: #f87171;      
    --term-bg: #0b0e14;   
  }
  
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    overflow: hidden;
  }

  #app { display: flex; height: 100vh; }

  /* ---- Terminal Area ---- */
  #stage {
    flex: 1;
    padding: 24px;
    min-width: 0;
    display: flex;
  }

  #frame {
    position: relative;
    padding: 12px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--term-bg);
    box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* CRT Scanline effect */
  #frame::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0, 0, 0, 0.15) 0px,
      rgba(0, 0, 0, 0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 10;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 4px;
    outline: none;
  }

  /* ---- Diagnostics Rail ---- */
  #diag {
    width: 280px;
    flex: 0 0 280px;
    background: var(--panel);
    border-left: 1px solid var(--edge);
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
    z-index: 20;
  }

  #diag header h1 {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--fg-dim);
    margin: 0;
    font-weight: 600;
    text-transform: uppercase;
  }

  .mod {
    background: var(--bg);
    border: 1px solid var(--edge);
    border-radius: 6px;
    padding: 16px;
  }

  .mod h2 {
    font-size: 11px;
    letter-spacing: 0.1em;
    margin: 0 0 12px;
    display: flex;
    justify-content: space-between;
    color: var(--accent);
    font-weight: 600;
  }
  .mod h2 span { color: var(--fg-dim); font-weight: 400; }

  .bar {
    height: 4px;
    background: var(--edge);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
    transition: width 0.3s ease, background 0.3s ease;
  }
  .bar.warn > i { background: var(--warn); }
  .bar.crit > i { background: var(--crit); }

  dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
    margin: 0;
    font-size: 11px;
  }
  dt { color: var(--fg-dim); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; color: var(--fg); }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <canvas id="screen"></canvas>
    </div>
  </div>

  <aside id="diag">
    <header><h1>Diagnostics</h1></header>

    <section class="mod">
      <h2>RAM <span id="ram-pct">0.0%</span></h2>
      <div class="bar" id="ram-bar-wrap"><i id="ram-bar"></i></div>
      <dl>
        <dt>Used</dt><dd id="ram-used">0 B</dd>
        <dt>Total</dt><dd id="ram-total">0 B</dd>
        <dt>Kernel</dt><dd id="ram-kernel">0 B</dd>
        <dt>Ops</dt><dd id="ram-ops">0 R / 0 W</dd>
      </dl>
    </section>

    <section class="mod">
      <h2>CPU <span id="cpu-pct">0%</span></h2>
      <div class="bar" id="cpu-bar-wrap"><i id="cpu-bar"></i></div>
      <dl>
        <dt>State</dt><dd id="cpu-state">idle</dd>
        <dt>PC</dt><dd id="cpu-pc">0x0000</dd>
        <dt>Cycles</dt><dd id="cpu-cycles">0</dd>
        <dt>Rate</dt><dd id="cpu-rate">0 Hz</dd>
      </dl>
    </section>

    <section class="mod">
      <h2>GPU <span id="gpu-pct">0%</span></h2>
      <div class="bar" id="gpu-bar-wrap"><i id="gpu-bar"></i></div>
      <dl>
        <dt>Grid</dt><dd id="gpu-grid">0×0</dd>
        <dt>Cursor</dt><dd id="gpu-cursor">0,0</dd>
        <dt>Chars</dt><dd id="gpu-chars">0</dd>
      </dl>
    </section>

    <section class="mod">
      <h2>STORAGE <span id="fs-pct">0.0%</span></h2>
      <div class="bar" id="fs-bar-wrap"><i id="fs-bar"></i></div>
      <dl>
        <dt>Used</dt><dd id="fs-used">0 B</dd>
        <dt>Files</dt><dd id="fs-files">0</dd>
        <dt>Backend</dt><dd id="fs-mode">…</dd>
      </dl>
    </section>
  </aside>
</div>

<!-- Load standard scripts to bypass file:// CORS restrictions -->
<script src="ram.js"></script>
<script src="cpu.js"></script>
<script src="gpu.js"></script>
<script src="fs.js"></script>
<script src="main.js"></script>
</body>
</html>
